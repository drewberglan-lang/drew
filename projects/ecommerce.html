<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summit Prints</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f3f0ea;
      text-align: center;
    }

    /* BANNER */
    .banner {
      background-image: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=80");
      background-size: cover;
      background-position: center;
      height: 300px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .banner h1 {
      margin: 0;
      font-size: 50px;
      text-shadow: 2px 2px 6px black;
    }

    .banner p {
      font-size: 20px;
      text-shadow: 2px 2px 6px black;
    }

    /* CONTACT BUTTON */
    .contact-btn {
      display: inline-block;
      margin: 20px;
      padding: 12px 22px;
      background-color: #2f5d50;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    /* GALLERY */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 30px;
    }

    .gallery a img {
      width: 220px;
      height: 300px;
      object-fit: cover;
      border: 3px solid #333;
      border-radius: 8px;
    }

    .gallery a img:hover {
      transform: scale(1.05);
      transition: 0.3s;
    }
  </style>
</head>

<body>

  <!-- BANNER -->
  <div class="banner">
    <h1>Summit Prints</h1>
    <p>Nature and National Park Posters</p>
  </div>

  <!-- CONTACT LINK -->
  <a class="contact-btn" href="contact.html">CONTACT ME FOR PRICES</a>

  <!-- IMAGE GALLERY -->
  <div class="gallery">
    <a href="print1.html">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=700&q=80" alt="Mountain Lake">
    </a>

    <a href="print2.html">
      <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80" alt="Forest">
    </a>

    <a href="print3.html">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80" alt="Waterfall">
    </a>

    <a href="print4.html">
      <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80" alt="Snowy Mountain">
    </a>

    <a href="print5.html">
      <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=700&q=80" alt="Desert">
    </a>

    <a href="print6.html">
      <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=700&q=80" alt="Lake Reflection">
    </a>
  </div>

</body>
</html>
