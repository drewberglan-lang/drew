<!DOCTYPE html>
<html lang="en">
<head>

  <title>Waterfall Poster Print</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f0ea;

      font-weight: bold;

<body>

  <figure>
